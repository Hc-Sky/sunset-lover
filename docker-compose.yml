version: '3.9'
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  mongo-express:
    image: mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongo
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      DB_NAME: ssr
      PORT: "4000"
      CORS_ORIGIN: http://localhost:5173
      SUN_API_BASE: https://api.sunrise-sunset.org
    depends_on:
      - mongo
  web:
    build: ./web
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  mongo-data:
